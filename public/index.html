<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ── Layout breakpoints ──
       Mobile (< 1024px): stacked — player 16:9 top, list fills rest
       Desktop (≥1024px): side-by-side — player fills left, list fixed 300px right
    */
    .noir-layout {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: calc(100dvh - 56px); /* header only */
    }
    @media (min-width: 1024px) {
      .noir-layout {
        grid-template-columns: 1fr 300px;
        grid-template-rows: 1fr;
        height: calc(100dvh - 53px); /* header + cat tabs */
      }
    }

    /* ── Player cell ── */
    .player-cell {
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Mobile: fixed 16:9 aspect ratio, constrained width */
    @media (max-width: 1023px) {
      .player-cell {
        width: 100%;
        aspect-ratio: 16 / 9;
        flex-shrink: 0;
      }
    }
    /* Desktop: fills all available space */
    @media (min-width: 1024px) {
      .player-cell {
        height: 100%;
      }
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* ── Channel list cell ── */
    .list-cell {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #0a0a0f;
      border-top: 1px solid #14141e;
    }
    @media (min-width: 1024px) {
      .list-cell {
        border-top: none;
        border-left: 1px solid #14141e;
        height: 100%;
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a48; }
    [data-scroller] { scrollbar-width: thin; }

    /* ── Category pills ── */
    .cat-pill {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #555;
      border: 1px solid transparent;
      white-space: nowrap;
      user-select: none;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .cat-pill:hover { color: #aaa; }
    .cat-pill.active {
      background: #14141e;
      color: #e0e0e0;
      border-color: #22222e;
    }

    /* ── Channel card ── */
    .ch-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      color: #777;
      transition: background 0.12s, color 0.12s;
    }
    .ch-btn:hover { background: #0f0f18; color: #bbb; }
    .ch-btn.active { background: #111120; color: #fff; }
    .ch-btn.active .ch-dot { background: #fff; }

    .ch-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #2a2a35;
      flex-shrink: 0;
    }
    .ch-logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      object-fit: contain;
      background: #0f0f18;
      flex-shrink: 0;
    }
    .ch-logo-fallback {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: #14141f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #3a3a4a;
      flex-shrink: 0;
    }
    .ch-name { font-size: 13px; font-weight: 500; }
    .ch-group { font-size: 11px; color: #3a3a4a; margin-top: 1px; }

    /* ── Loading spinner ── */
    .spin {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Overlay states ── */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .overlay.hidden { display: none; }
    .overlay.has-btns { pointer-events: all; }
    .overlay-text { font-size: 13px; color: #666; }
    .overlay-btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: #16161f;
      color: #aaa;
      transition: background 0.15s, color 0.15s;
    }
    .overlay-btn:hover { background: #1e1e2a; color: #fff; }

    /* ── Now-playing badge ── */
    #nowPlaying {
      position: absolute;
      bottom: 10px; left: 10px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 5;
    }
    #nowLogo {
      width: 20px; height: 20px;
      border-radius: 5px;
      object-fit: contain;
      background: #111;
      display: none;
    }
    #nowTitle {
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.55);
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    /* ── Mobile: compact header ── */
    .hdr-search { max-width: 160px; }
    @media (min-width: 480px) { .hdr-search { max-width: 200px; } }

    /* ── Focus ── */
    :focus-visible { outline: 2px solid #3a3a4a; outline-offset: 2px; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header style="height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;
                 background:rgba(10,10,15,0.96);backdrop-filter:blur(12px);
                 border-bottom:1px solid #14141e;position:relative;z-index:50">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div style="width:26px;height:26px;border-radius:8px;background:#0f0f18;border:1px solid #1a1a28;display:flex;align-items:center;justify-content:center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>
        </svg>
      </div>
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.3px;color:#d0d0d0">Noir TV</span>
    </div>
    <div class="hdr-search" style="position:relative;flex:1">
      <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:#444;pointer-events:none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Cari channel..." autocomplete="off" spellcheck="false"
             style="width:100%;background:#0e0e18;border:1px solid #18182a;border-radius:8px;padding:6px 8px 6px 30px;font-size:12px;color:#aaa;outline:none;transition:border-color 0.15s"
             onfocus="this.style.borderColor='#2a2a3a'"
             onblur="this.style.borderColor='#18182a'">
    </div>
  </header>

  <!-- ── Categories (desktop only — hidden on mobile, inline on mobile list header) ── -->
  <div id="catTabs" style="display:none;gap:5px;padding:8px 14px;overflow-x:auto;background:#0a0a0f;border-bottom:1px solid #111;scrollbar-width:none"
       class="lg:!flex">
    <button class="cat-pill active" data-cat="vidio">Vidio Live</button>
    <button class="cat-pill" data-cat="id">Indonesia</button>
    <button class="cat-pill" data-cat="news">Berita</button>
    <button class="cat-pill" data-cat="sports">Olahraga</button>
    <button class="cat-pill" data-cat="movies">Film</button>
    <button class="cat-pill" data-cat="all">Semua</button>
  </div>

  <!-- ── Main Layout ── -->
  <div class="noir-layout">

    <!-- ── Player ── -->
    <div class="player-cell">
      <video id="videoPlayer" controls playsinline style="width:100%;height:100%;object-fit:contain"></video>

      <!-- Loading -->
      <div id="playerLoading" class="overlay hidden">
        <div class="spin"></div>
        <span class="overlay-text">Memuat…</span>
      </div>

      <!-- Error -->
      <div id="playerError" class="overlay hidden has-btns" style="background:rgba(0,0,0,0.85)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="playerErrorText" class="overlay-text">Stream tidak tersedia</span>
        <button id="nextBtn" class="overlay-btn">Saluran Lain ▶</button>
      </div>

      <!-- Now-playing badge -->
      <div id="nowPlaying">
        <img id="nowLogo" src="" alt="">
        <span id="nowTitle"></span>
      </div>
    </div>

    <!-- ── Channel List ── -->
    <div class="list-cell">
      <!-- Mobile: category tabs inline here -->
      <div class="lg:hidden" style="display:flex;gap:5px;padding:8px 10px;overflow-x:auto;background:#0a0a0f;border-bottom:1px solid #111;scrollbar-width:none;flex-shrink:0">
        <button class="cat-pill active" data-cat="vidio">Vidio Live</button>
        <button class="cat-pill" data-cat="id">Indonesia</button>
        <button class="cat-pill" data-cat="news">Berita</button>
        <button class="cat-pill" data-cat="sports">Olahraga</button>
        <button class="cat-pill" data-cat="movies">Film</button>
        <button class="cat-pill" data-cat="all">Semua</button>
      </div>

      <!-- Count bar -->
      <div style="padding:7px 12px 6px;font-size:11px;color:#333;background:#0a0a0f;border-bottom:1px solid #0e0e18;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <span style="color:#444"><span id="channelCount">0</span> saluran</span>
        <span id="activeName" style="color:#2a2a3a;font-size:10px"></span>
      </div>

      <!-- Scrollable list -->
      <div id="channelList" data-scroller style="flex:1;overflow-y:auto;padding:5px 8px;display:flex;flex-direction:column;gap:1px">
        <div style="padding:24px;text-align:center;font-size:12px;color:#2a2a3a">Memuat…</div>
      </div>
    </div>
  </div>

  <!-- hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.5/dist/hls.min.js"></script>
  <script>
  (function() {
    'use strict';

    var SOURCES = {
      id:     'https://iptv-org.github.io/iptv/countries/id.m3u',
      news:   'https://iptv-org.github.io/iptv/categories/news.m3u',
      sports: 'https://iptv-org.github.io/iptv/categories/sports.m3u',
      movies: 'https://iptv-org.github.io/iptv/categories/movies.m3u',
      all:    'https://iptv-org.github.io/iptv/index.m3u'
    };

    var channels  = [];
    var filtered = [];
    var activeIdx = -1;
    var hlsInst  = null;

    var $    = function(id) { return document.getElementById(id); };
    var videoEl   = $('videoPlayer');
    var listEl    = $('channelList');
    var countEl   = $('channelCount');
    var activeNameEl = $('activeName');
    var loadingEl = $('playerLoading');
    var errorEl   = $('playerError');
    var errTxtEl  = $('playerErrorText');
    var nowTitle  = $('nowTitle');
    var nowLogo   = $('nowLogo');
    var nowPlaying = $('nowPlaying');

    // Sync both category tab strips (desktop top + mobile list header)
    function setActiveCat(cat) {
      document.querySelectorAll('.cat-pill').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-cat') === cat);
      });
    }

    // ── M3U parser ──
    function parseM3U(text) {
      var lines = text.replace(/\r\n?/g, '\n').split('\n');
      var out = [], curr = null;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.startsWith('#EXTINF:')) {
          curr = { name: 'Tanpa Nama', logo: '', group: '', url: '', referrer: '' };
          var nm = line.match(/,(.+)$/);
          if (nm) curr.name = nm[1].trim();
          var lg = line.match(/tvg-logo="([^"]*)"/i);
          if (lg) curr.logo = lg[1];
          var gp = line.match(/group-title="([^"]*)"/i);
          if (gp) curr.group = gp[1];
          var rf = line.match(/http-referrer="([^"]*)"/i);
          if (rf) curr.referrer = rf[1];
        } else if (line.startsWith('#EXTVLCOPT:http-referrer=') && curr) {
          curr.referrer = line.replace('#EXTVLCOPT:http-referrer=', '').trim();
        } else if (line && !line.startsWith('#') && curr) {
          curr.url = line;
          out.push(curr);
          curr = null;
        }
      }
      return out;
    }

    // ── Filter ──
    function applyFilter() {
      var q = ($('searchInput').value || '').toLowerCase().trim();
      filtered = q
        ? channels.filter(function(ch) {
            return ch.name.toLowerCase().indexOf(q) !== -1 ||
                   (ch.program && ch.program.toLowerCase().indexOf(q) !== -1) ||
                   (ch.group && ch.group.toLowerCase().indexOf(q) !== -1);
          })
        : channels.slice();
      activeIdx = -1;
    }

    // ── Render list ──
    function renderList() {
      countEl.textContent = filtered.length;
      if (!filtered.length) {
        listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#333">Tidak ada saluran</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var ch  = filtered[i];
        var isA = i === activeIdx;
        var initials = ch.name.substring(0, 2).toUpperCase();
        var subText = ch.program ? (ch.program + ' • ' + (ch.group || 'Live')) : (ch.group || 'Live');
        html +=
          '<button class="ch-btn' + (isA ? ' active' : '') + '" data-idx="' + i + '">' +
            (ch.logo
              ? '<img src="' + escHtml(ch.logo) + '" class="ch-logo" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="ch-logo-fallback" style="display:none">' + initials + '</div>'
              : '<div class="ch-logo-fallback">' + initials + '</div>'
            ) +
            '<div style="flex:1;min-width:0">' +
              '<div class="ch-name">' + escHtml(ch.name) + '</div>' +
              '<div class="ch-group" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escHtml(subText) + '</div>' +
            '</div>' +
            '<div class="ch-dot"></div>' +
          '</button>';
      }
      listEl.innerHTML = html;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function startHls(targetUrl, autoAdvance) {
      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }

      if (window.Hls && window.Hls.isSupported()) {
        hlsInst = new window.Hls({ enableWorker: true, lowLatencyMode: false });
        hlsInst.loadSource(targetUrl);
        hlsInst.attachMedia(videoEl);
        hlsInst.on(window.Hls.Events.MANIFEST_PARSED, function() {
          loadingEl.classList.add('hidden');
          videoEl.play().catch(function() {});
        });
        hlsInst.on(window.Hls.Events.ERROR, function(e, data) {
          if (data.fatal) {
            loadingEl.classList.add('hidden');
            var msg = 'Stream tidak tersedia';
            if (data.details === window.Hls.ErrorDetails.MANIFEST_LOAD_ERROR && data.response && data.response.data) {
              msg = String(data.response.data).slice(0, 140);
            }
            errTxtEl.textContent = msg;
            errorEl.classList.remove('hidden');
            if (autoAdvance) {
              setTimeout(function() {
                var nxt = activeIdx + 1;
                if (nxt < filtered.length) playChannel(nxt);
              }, 1500);
            }
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = targetUrl;
        videoEl.addEventListener('loadedmetadata', function() {
          loadingEl.classList.add('hidden');
          videoEl.play().catch(function() {});
        }, { once: true });
        videoEl.addEventListener('error', function() {
          loadingEl.classList.add('hidden');
          errTxtEl.textContent = 'Stream tidak tersedia';
          errorEl.classList.remove('hidden');
        }, { once: true });
      } else {
        loadingEl.classList.add('hidden');
        errTxtEl.textContent = 'Browser tidak didukung';
        errorEl.classList.remove('hidden');
      }
    }

    // ── Play ──
    function playChannel(idx) {
      if (idx < 0 || idx >= filtered.length) return;
      var ch = filtered[idx];
      activeIdx = idx;

      // Now-playing overlay
      nowTitle.textContent = ch.name + (ch.program ? ' — ' + ch.program : '');
      if (ch.logo) {
        nowLogo.src = ch.logo;
        nowLogo.style.display = 'block';
      } else {
        nowLogo.style.display = 'none';
      }
      nowPlaying.style.opacity = '1';
      if (activeNameEl) activeNameEl.textContent = '▶ ' + ch.name;

      // Reset overlays & video
      errorEl.classList.add('hidden');
      loadingEl.classList.remove('hidden');
      videoEl.src = '';
      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }

      if (ch.channel_id) {
        var target = 'https://tv.161.118.236.126.nip.io/index.m3u8?ch=' + encodeURIComponent(ch.channel_id);
        startHls(target, false);
      } else {
        var targetUrl = '/api/proxy?url=' + encodeURIComponent(ch.url);
        startHls(targetUrl, true);
      }

      renderList();
    }

    // ── Load category ──
    function loadCategory(cat) {
      listEl.innerHTML = '<div style="padding:24px;text-align:center;font-size:12px;color:#2a2a3a">Memuat…</div>';
      nowPlaying.style.opacity = '0';
      if (activeNameEl) activeNameEl.textContent = '';
      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
      videoEl.src = '';

      if (cat === 'vidio') {
        fetch('/api/vidio?type=all')
          .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function(data) {
            channels = data.channels || [];
            applyFilter();
            renderList();
            if (filtered.length > 0) playChannel(0);
          })
          .catch(function(err) {
            listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#3a2020">Gagal memuat Vidio Live (' + escHtml(err.message) + ')</div>';
          });
        return;
      }

      var src = '/api/proxy?url=' + encodeURIComponent(SOURCES[cat]);
      var req = new XMLHttpRequest();
      req.open('GET', src, true);
      req.onload = function() {
        if (req.status === 200) {
          channels = parseM3U(req.responseText);
          applyFilter();
          renderList();
          if (filtered.length > 0) playChannel(0);
        } else {
          listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#3a2020">Gagal memuat (HTTP ' + req.status + ')</div>';
        }
      };
      req.onerror = function() {
        listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#3a2020">Gagal memuat. Cek koneksi.</div>';
      };
      req.send();
    }

    // ── Events ──
    listEl.addEventListener('click', function(e) {
      var btn = e.target.closest('.ch-btn');
      if (btn) playChannel(parseInt(btn.getAttribute('data-idx'), 10));
    });

    $('catTabs').addEventListener('click', function(e) {
      var btn = e.target.closest('.cat-pill');
      if (!btn) return;
      var cat = btn.getAttribute('data-cat');
      setActiveCat(cat);
      loadCategory(cat);
    });

    // Mobile list-header tab strip (separate element, same handler)
    var mobileTabs = document.querySelector('.list-cell .lg\\:hidden');
    if (mobileTabs) {
      mobileTabs.addEventListener('click', function(e) {
        var btn = e.target.closest('.cat-pill');
        if (!btn) return;
        var cat = btn.getAttribute('data-cat');
        setActiveCat(cat);
        loadCategory(cat);
      });
    }

    $('searchInput').addEventListener('input', function() {
      applyFilter();
      renderList();
    });

    $('nextBtn').addEventListener('click', function() {
      var nxt = activeIdx + 1;
      playChannel(nxt < filtered.length ? nxt : 0);
    });

    // ── Init ──
    loadCategory('vidio');
  })();
  </script>
</body>
</html>
