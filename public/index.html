<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir TV - Premium Stream Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-gray-800/80 bg-gray-900/50 backdrop-blur-md sticky top-0 z-30 px-4 lg:px-6 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i data-lucide="tv" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
            Noir TV <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">PRO</span>
          </h1>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari saluran TV..." 
          class="w-full bg-gray-900 border border-gray-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-2 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
        >
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

    <!-- Player Container (8 Cols) -->
    <div class="lg:col-span-8 flex flex-col gap-4">
      <div class="relative aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl group flex items-center justify-center">
        <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>

        <!-- Loading -->
        <div id="playerLoading" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center gap-3 z-10 hidden">
          <div class="w-8 h-8 border-3 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
          <span class="text-xs text-gray-300 font-medium">Menghubungkan siaran...</span>
        </div>

        <!-- Error Panel -->
        <div id="playerError" class="absolute inset-0 bg-gray-950/95 flex flex-col items-center justify-center p-6 text-center gap-3 z-20 hidden">
          <div class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-white">Siaran Tidak Tersedia / Disetop</h3>
            <p id="playerErrorText" class="text-xs text-gray-400 mt-1 max-w-sm">Saluran ini mungkin offline dari penyedia aslinya.</p>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <button id="retryBtn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
              <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Muat Ulang
            </button>
            <button id="nextBtn" class="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-semibold transition">
              Saluran Lain
            </button>
          </div>
        </div>
      </div>

      <!-- Channel Details Card -->
      <div class="bg-gray-900/60 border border-gray-800/80 p-4 rounded-2xl flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5 min-w-0">
          <div id="currentLogo" class="w-11 h-11 rounded-xl bg-gray-800 border border-gray-700/60 flex items-center justify-center p-1 shrink-0">
            <i data-lucide="tv" class="w-5 h-5 text-gray-400"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="currentTitle" class="font-bold text-base text-white truncate">Pilih Saluran TV</h2>
              <span id="badgeProxy" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">CORS AUTO-PROXY</span>
            </div>
            <p id="currentMeta" class="text-xs text-gray-400 truncate mt-0.5">Daftar siaran IPTV Indonesia & Global</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="shareBtn" class="p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl border border-gray-700/60 transition">
            <i data-lucide="share-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Channel Sidebar (4 Cols) -->
    <div class="lg:col-span-4 flex flex-col gap-3 max-h-[82vh]">
      
      <!-- Categories -->
      <div class="flex items-center gap-1 overflow-x-auto p-1 bg-gray-900/60 border border-gray-800 rounded-xl custom-scrollbar shrink-0 text-xs font-semibold">
        <button class="cat-tab active px-3 py-1.5 rounded-lg bg-indigo-600 text-white" data-cat="id">🇮🇩 Indo</button>
        <button class="cat-tab px-3 py-1.5 rounded-lg text-gray-400 hover:text-white" data-cat="news">Berita</button>
        <button class="cat-tab px-3 py-1.5 rounded-lg text-gray-400 hover:text-white" data-cat="sports">Olahraga</button>
        <button class="cat-tab px-3 py-1.5 rounded-lg text-gray-400 hover:text-white" data-cat="movies">Film</button>
        <button class="cat-tab px-3 py-1.5 rounded-lg text-gray-400 hover:text-white" data-cat="all">Semua</button>
      </div>

      <!-- Channel List -->
      <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-3 flex-1 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between text-xs text-gray-400 font-medium pb-2 border-b border-gray-800/80">
          <span>Saluran Tersedia (<span id="channelCount">0</span>)</span>
          <span class="text-[10px] text-emerald-400 font-semibold">Auto Failover</span>
        </div>

        <div id="channelList" class="flex-1 overflow-y-auto space-y-1.5 mt-2 pr-1 custom-scrollbar">
          <!-- Item list -->
        </div>
      </div>

    </div>

  </main>

  <script>
    lucide.createIcons();

    const SOURCES = {
      id: "https://iptv-org.github.io/iptv/countries/id.m3u",
      news: "https://iptv-org.github.io/iptv/categories/news.m3u",
      sports: "https://iptv-org.github.io/iptv/categories/sports.m3u",
      movies: "https://iptv-org.github.io/iptv/categories/movies.m3u",
      all: "https://iptv-org.github.io/iptv/index.m3u"
    };

    let channels = [];
    let activeChannel = null;
    let hls = null;
    let autoProxyTried = false;

    const video = document.getElementById("videoPlayer");
    const searchInput = document.getElementById("searchInput");
    const channelListEl = document.getElementById("channelList");
    const channelCountEl = document.getElementById("channelCount");
    const currentTitle = document.getElementById("currentTitle");
    const currentMeta = document.getElementById("currentMeta");
    const currentLogo = document.getElementById("currentLogo");
    const playerLoading = document.getElementById("playerLoading");
    const playerError = document.getElementById("playerError");
    const playerErrorText = document.getElementById("playerErrorText");
    const badgeProxy = document.getElementById("badgeProxy");

    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const res = [];
      let curr = null;

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith("#EXTINF:")) {
          curr = { name: "Saluran TV", logo: "", group: "", url: "", referrer: "" };
          const nameMatch = line.match(/,(.+)$/);
          if (nameMatch) curr.name = nameMatch[1].trim();
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          if (logoMatch) curr.logo = logoMatch[1];
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          if (groupMatch) curr.group = groupMatch[1];
          const refMatch = line.match(/http-referrer="([^"]*)"/i);
          if (refMatch) curr.referrer = refMatch[1];
        } else if (line.startsWith("#EXTVLCOPT:http-referrer=")) {
          if (curr) curr.referrer = line.replace("#EXTVLCOPT:http-referrer=", "").trim();
        } else if (line && !line.startsWith("#") && curr) {
          curr.url = line;
          res.push(curr);
          curr = null;
        }
      }
      return res;
    }

    async function loadCategory(cat) {
      channelListEl.innerHTML = `<div class="p-4 text-center text-xs text-gray-400 animate-pulse">Memuat playlist...</div>`;
      try {
        const res = await fetch(SOURCES[cat]);
        const text = await res.text();
        channels = parseM3U(text);
        renderChannels(channels);
        if (channels.length > 0 && !activeChannel) {
          playChannel(channels[0]);
        }
      } catch (e) {
        channelListEl.innerHTML = `<div class="p-4 text-center text-xs text-rose-400">Gagal mengambil saluran</div>`;
      }
    }

    function renderChannels(list) {
      channelCountEl.textContent = list.length;
      if (list.length === 0) {
        channelListEl.innerHTML = `<div class="p-4 text-center text-xs text-gray-500">Tidak ada saluran</div>`;
        return;
      }

      channelListEl.innerHTML = list.map((ch, idx) => {
        const isActive = activeChannel && activeChannel.url === ch.url;
        const logo = ch.logo 
          ? `<img src="${ch.logo}" class="w-7 h-7 object-contain rounded bg-gray-950 p-0.5" onerror="this.remove();" />`
          : `<div class="w-7 h-7 rounded bg-gray-800 text-[10px] font-bold flex items-center justify-center text-gray-400">${ch.name.slice(0,2).toUpperCase()}</div>`;

        return `
          <button onclick="selectChannel(${idx})" class="w-full text-left p-2 rounded-xl border flex items-center justify-between transition ${
            isActive ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-gray-900/40 border-gray-800/80 hover:bg-gray-800 text-gray-300'
          }">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              ${logo}
              <div class="truncate">
                <div class="font-medium text-xs truncate">${ch.name}</div>
                <div class="text-[10px] text-gray-500 truncate">${ch.group || 'Live'}</div>
              </div>
            </div>
            <i data-lucide="play-circle" class="w-4 h-4 text-gray-500 shrink-0"></i>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function playChannel(ch, forceProxy = false) {
      activeChannel = ch;
      currentTitle.textContent = ch.name;
      currentMeta.textContent = `${ch.group || 'Umum'} • ${new URL(ch.url).hostname}`;
      badgeProxy.classList.toggle("hidden", !forceProxy);

      if (ch.logo) {
        currentLogo.innerHTML = `<img src="${ch.logo}" class="w-full h-full object-contain rounded-lg" onerror="this.parentElement.innerHTML='<i data-lucide=\\'tv\\' class=\\'w-5 h-5 text-gray-400\\'></i>'; lucide.createIcons();" />`;
      } else {
        currentLogo.innerHTML = `<i data-lucide="tv" class="w-5 h-5 text-gray-400"></i>`;
        lucide.createIcons();
      }

      playerError.classList.add("hidden");
      playerLoading.classList.remove("hidden");

      let targetUrl = ch.url;
      if (forceProxy) {
        targetUrl = `/api/proxy?url=${encodeURIComponent(ch.url)}`;
        if (ch.referrer) targetUrl += `&referrer=${encodeURIComponent(ch.referrer)}`;
      }

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(targetUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          playerLoading.classList.add("hidden");
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (evt, data) => {
          if (data.fatal) {
            // Auto fallback to CORS proxy once if direct fails
            if (!forceProxy && !autoProxyTried) {
              autoProxyTried = true;
              playChannel(ch, true);
            } else {
              playerLoading.classList.add("hidden");
              playerError.classList.remove("hidden");
              playerErrorText.textContent = `Siaran tidak dapat dimuat (${data.details}).`;
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = targetUrl;
        video.addEventListener("loadedmetadata", () => {
          playerLoading.classList.add("hidden");
          video.play().catch(() => {});
        });
        video.addEventListener("error", () => {
          if (!forceProxy && !autoProxyTried) {
            autoProxyTried = true;
            playChannel(ch, true);
          } else {
            playerLoading.classList.add("hidden");
            playerError.classList.remove("hidden");
          }
        });
      }

      renderChannels(getFiltered());
    }

    window.selectChannel = (idx) => {
      autoProxyTried = false;
      const list = getFiltered();
      if (list[idx]) playChannel(list[idx], false);
    };

    function getFiltered() {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) return channels;
      return channels.filter(c => c.name.toLowerCase().includes(q));
    }

    document.querySelectorAll(".cat-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".cat-tab").forEach(t => {
          t.classList.remove("bg-indigo-600", "text-white");
          t.classList.add("text-gray-400");
        });
        tab.classList.add("bg-indigo-600", "text-white");
        tab.classList.remove("text-gray-400");
        autoProxyTried = false;
        loadCategory(tab.dataset.cat);
      });
    });

    searchInput.addEventListener("input", () => renderChannels(getFiltered()));
    document.getElementById("retryBtn").addEventListener("click", () => {
      autoProxyTried = false;
      if (activeChannel) playChannel(activeChannel, false);
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      autoProxyTried = false;
      const list = getFiltered();
      const idx = list.findIndex(c => c.url === activeChannel.url);
      if (idx !== -1 && idx + 1 < list.length) playChannel(list[idx + 1], false);
      else if (list.length > 0) playChannel(list[0], false);
    });
    document.getElementById("shareBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Link disalin!");
    });

    loadCategory("id");
  </script>
</body>
</html>
