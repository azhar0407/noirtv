<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a48; }

    /* Smooth transitions */
    .ch-btn { transition: background 0.15s; }

    /* Category pills — clean, no emoji */
    .cat-pill {
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #666;
      border: 1px solid transparent;
      white-space: nowrap;
      user-select: none;
    }
    .cat-pill:hover { color: #ccc; }
    .cat-pill.active {
      background: #1a1a24;
      color: #fff;
      border-color: #2a2a35;
    }

    /* Channel card */
    .ch-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      color: #888;
    }
    .ch-btn:hover { background: #12121a; color: #ccc; }
    .ch-btn.active { background: #13131e; color: #fff; }
    .ch-btn.active .ch-dot { background: #fff; }

    .ch-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    .ch-logo {
      width: 28px; height: 28px;
      border-radius: 7px;
      object-fit: contain;
      background: #111;
      flex-shrink: 0;
    }
    .ch-logo-fallback {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: #18181f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #444;
      flex-shrink: 0;
    }
    .ch-name { font-size: 13px; font-weight: 500; }
    .ch-group { font-size: 11px; color: #444; margin-top: 1px; }

    /* Player */
    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Loading spinner */
    .spin {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Overlay states */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-text { font-size: 13px; color: #888; }
    .overlay-btn {
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: #1f1f2a;
      color: #ccc;
      transition: background 0.15s;
    }
    .overlay-btn:hover { background: #2a2a38; color: #fff; }

    /* Focus */
    :focus-visible { outline: 2px solid #444; outline-offset: 2px; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="sticky top-0 z-50 px-4 py-3 flex items-center gap-3"
          style="background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);border-bottom:1px solid #14141e">
    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:26px;height:26px;border-radius:8px;background:#13131e;border:1px solid #1f1f2a;display:flex;align-items:center;justify-content:center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>
        </svg>
      </div>
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.3px">Noir TV</span>
    </div>

    <!-- Search -->
    <div style="position:relative;flex:1;max-width:220px">
      <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#555;pointer-events:none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Cari..." autocomplete="off"
             style="width:100%;background:#111;border:1px solid #1a1a24;border-radius:8px;padding:6px 8px 6px 30px;font-size:12px;color:#ccc;outline:none;transition:border-color 0.15s"
             onfocus="this.style.borderColor='#2a2a38'"
             onblur="this.style.borderColor='#1a1a24'">
    </div>
  </header>

  <!-- ── Categories ── -->
  <div id="catTabs" style="display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid #14141e;scrollbar-width:none">
    <button class="cat-pill active" data-cat="id">Indonesia</button>
    <button class="cat-pill" data-cat="news">Berita</button>
    <button class="cat-pill" data-cat="sports">Olahraga</button>
    <button class="cat-pill" data-cat="movies">Film</button>
    <button class="cat-pill" data-cat="all">Semua</button>
  </div>

  <!-- ── Layout ── -->
  <div style="display:grid;grid-template-columns:1fr;height:calc(100dvh - 97px)"
       class="lg:grid-cols-[1fr_320px] lg:grid-rows-[1fr_auto]">

    <!-- ── Player ── -->
    <div style="position:relative;background:#000;display:flex;align-items:center;justify-content:center">
      <video id="videoPlayer" controls playsinline style="width:100%;height:100%;object-fit:contain"></video>

      <!-- Loading -->
      <div id="playerLoading" class="overlay hidden">
        <div class="spin"></div>
        <span class="overlay-text">Memuat...</span>
      </div>

      <!-- Error -->
      <div id="playerError" class="overlay hidden" style="background:rgba(0,0,0,0.88)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="playerErrorText" class="overlay-text">Stream tidak tersedia</span>
        <button id="nextBtn" class="overlay-btn">Saluran Lain</button>
      </div>

      <!-- Channel name overlay (subtle, bottom-left) -->
      <div id="nowPlaying" style="position:absolute;bottom:12px;left:12px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 0.3s;pointer-events:none">
        <img id="nowLogo" src="" alt="" style="width:22px;height:22px;border-radius:5px;object-fit:contain;background:#111;display:none">
        <span id="nowTitle" style="font-size:12px;font-weight:500;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.5);padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)"></span>
      </div>
    </div>

    <!-- ── Channel List ── -->
    <div style="border-top:1px solid #14141e;overflow:hidden;display:flex;flex-direction:column;background:#0a0a0f"
         class="lg:border-t-0 lg:border-l">
      <!-- Count bar -->
      <div style="padding:8px 12px 6px;font-size:11px;color:#444;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center">
        <span><span id="channelCount">0</span> saluran</span>
        <span style="font-size:10px;color:#333">HLS</span>
      </div>
      <!-- List -->
      <div id="channelList" style="flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:1px">
        <div style="padding:20px;text-align:center;font-size:12px;color:#333">Memuat...</div>
      </div>
    </div>
  </div>

  <!-- hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.1/dist/hls.min.js"></script>
  <script>
  (function() {
    'use strict';

    var SOURCES = {
      id:     'https://iptv-org.github.io/iptv/countries/id.m3u',
      news:   'https://iptv-org.github.io/iptv/categories/news.m3u',
      sports: 'https://iptv-org.github.io/iptv/categories/sports.m3u',
      movies: 'https://iptv-org.github.io/iptv/categories/movies.m3u',
      all:    'https://iptv-org.github.io/iptv/index.m3u'
    };

    var channels  = [];
    var filtered = [];
    var activeIdx = -1;
    var hlsInst  = null;

    var $    = function(id) { return document.getElementById(id); };
    var videoEl   = $('videoPlayer');
    var listEl    = $('channelList');
    var countEl   = $('channelCount');
    var loadingEl = $('playerLoading');
    var errorEl   = $('playerError');
    var errTxtEl  = $('playerErrorText');
    var nowTitle  = $('nowTitle');
    var nowLogo   = $('nowLogo');
    var nowPlaying = $('nowPlaying');

    // ── M3U parser ──
    function parseM3U(text) {
      var lines = text.replace(/\r\n?/g, '\n').split('\n');
      var out = [], curr = null;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.startsWith('#EXTINF:')) {
          curr = { name: 'Tanpa Nama', logo: '', group: '', url: '', referrer: '' };
          var nm = line.match(/,(.+)$/);
          if (nm) curr.name = nm[1].trim();
          var lg = line.match(/tvg-logo="([^"]*)"/i);
          if (lg) curr.logo = lg[1];
          var gp = line.match(/group-title="([^"]*)"/i);
          if (gp) curr.group = gp[1];
          var rf = line.match(/http-referrer="([^"]*)"/i);
          if (rf) curr.referrer = rf[1];
        } else if (line.startsWith('#EXTVLCOPT:http-referrer=') && curr) {
          curr.referrer = line.replace('#EXTVLCOPT:http-referrer=', '').trim();
        } else if (line && !line.startsWith('#') && curr) {
          curr.url = line;
          out.push(curr);
          curr = null;
        }
      }
      return out;
    }

    // ── Filter ──
    function applyFilter() {
      var q = ($('searchInput').value || '').toLowerCase().trim();
      filtered = q
        ? channels.filter(function(ch) {
            return ch.name.toLowerCase().indexOf(q) !== -1 ||
                   (ch.group && ch.group.toLowerCase().indexOf(q) !== -1);
          })
        : channels.slice();
      activeIdx = -1;
    }

    // ── Render list ──
    function renderList() {
      countEl.textContent = filtered.length;
      if (!filtered.length) {
        listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#333">Tidak ada saluran</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var ch  = filtered[i];
        var isA = i === activeIdx;
        var initials = ch.name.substring(0, 2).toUpperCase();
        html +=
          '<button class="ch-btn' + (isA ? ' active' : '') + '" data-idx="' + i + '">' +
            (ch.logo
              ? '<img src="' + escHtml(ch.logo) + '" class="ch-logo" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="ch-logo-fallback" style="display:none">' + initials + '</div>'
              : '<div class="ch-logo-fallback">' + initials + '</div>'
            ) +
            '<div style="flex:1;min-width:0">' +
              '<div class="ch-name">' + escHtml(ch.name) + '</div>' +
              '<div class="ch-group">' + escHtml(ch.group || 'Live') + '</div>' +
            '</div>' +
            '<div class="ch-dot"></div>' +
          '</button>';
      }
      listEl.innerHTML = html;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Play ──
    function playChannel(idx) {
      if (idx < 0 || idx >= filtered.length) return;
      var ch = filtered[idx];
      activeIdx = idx;

      // Now-playing overlay
      nowTitle.textContent = ch.name;
      if (ch.logo) {
        nowLogo.src = ch.logo;
        nowLogo.style.display = 'block';
      } else {
        nowLogo.style.display = 'none';
      }
      nowPlaying.style.opacity = '1';

      // Hide overlays
      errorEl.classList.add('hidden');
      loadingEl.classList.remove('hidden');

      var targetUrl = '/api/proxy?url=' + encodeURIComponent(ch.url);

      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }

      if (window.Hls && window.Hls.isSupported()) {
        hlsInst = new window.Hls({ enableWorker: true, lowLatencyMode: false });
        hlsInst.loadSource(targetUrl);
        hlsInst.attachMedia(videoEl);
        hlsInst.on(window.Hls.Events.MANIFEST_PARSED, function() {
          loadingEl.classList.add('hidden');
          videoEl.play().catch(function() {});
        });
        hlsInst.on(window.Hls.Events.ERROR, function(e, data) {
          if (data.fatal) {
            loadingEl.classList.add('hidden');
            errTxtEl.textContent = 'Stream tidak tersedia';
            errorEl.classList.remove('hidden');
            setTimeout(function() {
              var nxt = activeIdx + 1;
              if (nxt < filtered.length) playChannel(nxt);
            }, 1500);
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = targetUrl;
        videoEl.addEventListener('loadedmetadata', function() {
          loadingEl.classList.add('hidden');
          videoEl.play().catch(function() {});
        }, { once: true });
        videoEl.addEventListener('error', function() {
          loadingEl.classList.add('hidden');
          errTxtEl.textContent = 'Stream tidak tersedia';
          errorEl.classList.remove('hidden');
        }, { once: true });
      } else {
        loadingEl.classList.add('hidden');
        errTxtEl.textContent = 'Browser tidak didukung';
        errorEl.classList.remove('hidden');
      }

      renderList();
    }

    // ── Load category ──
    function loadCategory(cat) {
      listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#333">Memuat...</div>';
      nowPlaying.style.opacity = '0';
      if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
      videoEl.src = '';

      var src = '/api/proxy?url=' + encodeURIComponent(SOURCES[cat]);
      var req = new XMLHttpRequest();
      req.open('GET', src, true);
      req.onload = function() {
        if (req.status === 200) {
          channels = parseM3U(req.responseText);
          applyFilter();
          renderList();
          if (filtered.length > 0) playChannel(0);
        } else {
          listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#3a2020">Gagal memuat (HTTP ' + req.status + ')</div>';
        }
      };
      req.onerror = function() {
        listEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:#3a2020">Gagal memuat. Cek koneksi.</div>';
      };
      req.send();
    }

    // ── Events ──
    listEl.addEventListener('click', function(e) {
      var btn = e.target.closest('.ch-btn');
      if (btn) playChannel(parseInt(btn.getAttribute('data-idx'), 10));
    });

    $('catTabs').addEventListener('click', function(e) {
      var btn = e.target.closest('.cat-pill');
      if (!btn) return;
      document.querySelectorAll('.cat-pill').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadCategory(btn.getAttribute('data-cat'));
    });

    $('searchInput').addEventListener('input', function() {
      applyFilter();
      renderList();
    });

    $('nextBtn').addEventListener('click', function() {
      var nxt = activeIdx + 1;
      playChannel(nxt < filtered.length ? nxt : 0);
    });

    // ── Init ──
    loadCategory('id');
  })();
  </script>
</body>
</html>
