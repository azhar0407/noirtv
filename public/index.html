<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir TV - Premium Stream Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#eff6ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col antialiased">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-gray-950/90 border-b border-gray-800/80 backdrop-blur-md px-3 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 shrink-0">
          <i data-lucide="tv" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight text-white flex items-center gap-1.5">
            Noir TV <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">PRO</span>
          </h1>
          <p class="text-[10px] text-gray-400 -mt-0.5">Live IPTV Stream</p>
        </div>
      </div>
      <div class="relative w-full max-w-[200px]">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
        <input type="text" id="searchInput" placeholder="Cari saluran..." autocomplete="off"
          class="w-full bg-gray-900/80 border border-gray-800/60 focus:border-indigo-500/50 rounded-lg pl-8 pr-3 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
      </div>
    </div>
  </header>

  <!-- Category Strip -->
  <div class="sticky top-[50px] z-20 bg-gray-950/90 border-b border-gray-800/60 px-3 py-2">
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-0.5">
        <button class="cat-btn active min-w-[68px] px-2.5 py-1.5 rounded-md bg-indigo-600 text-white text-xs font-semibold transition" data-cat="id">🇮🇩 Indo</button>
        <button class="cat-btn min-w-[55px] px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 text-xs font-semibold transition" data-cat="news">Berita</button>
        <button class="cat-btn min-w-[60px] px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 text-xs font-semibold transition" data-cat="sports">Olahraga</button>
        <button class="cat-btn min-w-[55px] px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 text-xs font-semibold transition" data-cat="movies">Film</button>
        <button class="cat-btn min-w-[50px] px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 text-xs font-semibold transition" data-cat="all">Semua</button>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <main class="max-w-7xl mx-auto w-full p-3 lg:p-5 grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">

    <!-- Player Area (8/12 cols) -->
    <div class="lg:col-span-8 flex flex-col gap-3">
      <div class="relative aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl flex items-center justify-center">

        <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>

        <!-- Loading Overlay -->
        <div id="playerLoading" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center gap-3 z-10 hidden">
          <div class="w-8 h-8 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
          <span class="text-xs text-gray-300 font-medium">Memuat siaran...</span>
        </div>

        <!-- Error Overlay -->
        <div id="playerError" class="absolute inset-0 bg-gray-950/95 flex flex-col items-center justify-center p-6 text-center gap-3 z-20 hidden">
          <div class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-white">Siaran Tidak Tersedia</h3>
            <p id="playerErrorText" class="text-xs text-gray-400 mt-1 max-w-xs">Saluran ini offline atau stream telah berakhir.</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="retryBtn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
              <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Muat Ulang
            </button>
            <button id="nextBtn" class="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-semibold transition">
              Saluran Lain →
            </button>
          </div>
        </div>
      </div>

      <!-- Info Bar -->
      <div class="bg-gray-900/60 border border-gray-800/80 p-3 rounded-2xl flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div id="currentLogo" class="w-10 h-10 rounded-xl bg-gray-800 border border-gray-700/60 flex items-center justify-center p-1 shrink-0">
            <i data-lucide="tv" class="w-5 h-5 text-gray-400"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="currentTitle" class="font-bold text-sm text-white truncate">Pilih Saluran</h2>
            </div>
            <p id="currentMeta" class="text-[11px] text-gray-400 truncate mt-0.5">Daftar saluran IPTV Indonesia & Global</p>
          </div>
        </div>
        <button id="shareBtn" class="p-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl border border-gray-700/60 transition shrink-0">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Channel Sidebar (4/12 cols) -->
    <div class="lg:col-span-4 flex flex-col gap-2.5 max-h-[82vh]">
      <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-2.5 flex-1 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between text-xs text-gray-400 font-medium pb-2 mb-2 border-b border-gray-800/80">
          <span>Saluran (<span id="channelCount">0</span>)</span>
          <span class="text-[10px] text-emerald-400 font-semibold">HLS Live</span>
        </div>
        <div id="channelList" class="flex-1 overflow-y-auto space-y-1 pr-0.5 custom-scrollbar">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const SOURCES = {
      id:     "https://iptv-org.github.io/iptv/countries/id.m3u",
      news:   "https://iptv-org.github.io/iptv/categories/news.m3u",
      sports: "https://iptv-org.github.io/iptv/categories/sports.m3u",
      movies: "https://iptv-org.github.io/iptv/categories/movies.m3u",
      all:    "https://iptv-org.github.io/iptv/index.m3u"
    };

    // All state in one place
    const state = {
      all: [],       // full unfiltered channel list
      filtered: [],  // current filtered view
      activeIdx: -1, // index into filtered array
      category: "id"
    };

    const $ = id => document.getElementById(id);

    function parseM3U(text) {
      const lines = text.split(/\r?\n/), out = [];
      let curr = null;
      for (const line of lines) {
        const t = line.trim();
        if (t.startsWith("#EXTINF:")) {
          curr = { name: "Tanpa Nama", logo: "", group: "", url: "", referrer: "" };
          const m = t.match(/,(.+)$/);    if (m) curr.name = m[1].trim();
          const l = t.match(/tvg-logo="([^"]*)"/i); if (l) curr.logo = l[1];
          const g = t.match(/group-title="([^"]*)"/i); if (g) curr.group = g[1];
          const r = t.match(/http-referrer="([^"]*)"/i); if (r) curr.referrer = r[1];
        } else if (t === "#EXTVLCOPT:http-referrer=" && curr) {
          // edge case: referrer on next line
          curr.referrer = "";
        } else if (t.startsWith("#EXTVLCOPT:http-referrer=") && curr) {
          curr.referrer = t.replace("#EXTVLCOPT:http-referrer=", "").trim();
        } else if (t && !t.startsWith("#") && curr) {
          curr.url = t;
          out.push(curr);
          curr = null;
        }
      }
      return out;
    }

    function applyFilter() {
      const q = $("searchInput").value.toLowerCase().trim();
      state.filtered = q ? state.all.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q)) : [...state.all];
      state.activeIdx = -1; // reset active when filter changes
    }

    function renderList() {
      $("channelCount").textContent = state.filtered.length;
      const el = $("channelList");

      if (state.filtered.length === 0) {
        el.innerHTML = `<div class="p-4 text-center text-xs text-gray-500">Tidak ada saluran ditemukan</div>`;
        return;
      }

      el.innerHTML = state.filtered.map((ch, i) => {
        const active = i === state.activeIdx;
        const logo = ch.logo
          ? `<img src="${ch.logo}" class="w-7 h-7 object-contain rounded bg-gray-950 p-0.5 shrink-0" onerror="this.style.display='none'" />`
          : `<div class="w-7 h-7 rounded bg-gray-800 text-[10px] font-bold flex items-center justify-center text-gray-400 shrink-0">${ch.name.slice(0,2).toUpperCase()}</div>`;
        return `<button onclick="play(${i})" class="w-full text-left p-2 rounded-xl border flex items-center justify-between gap-2 transition ${active ? 'bg-indigo-600/20 border-indigo-500/50' : 'bg-gray-900/40 border-gray-800/80 hover:bg-gray-800/80'}">
          <div class="flex items-center gap-2.5 min-w-0">
            ${logo}
            <div class="truncate">
              <div class="font-medium text-xs truncate ${active ? 'text-indigo-300' : 'text-gray-200'}">${ch.name}</div>
              <div class="text-[10px] text-gray-500 truncate">${ch.group || 'Live'}</div>
            </div>
          </div>
          <i data-lucide="${active ? 'disc' : 'circle'}" class="w-3.5 h-3.5 shrink-0 ${active ? 'text-indigo-400' : 'text-gray-600'}"></i>
        </button>`;
      }).join("");
      lucide.createIcons();
    }

    function loadPlaylist(cat) {
      state.category = cat;
      state.activeIdx = -1;
      $("channelList").innerHTML = `<div class="p-4 text-center text-xs text-gray-400 animate-pulse">Memuat playlist...</div>`;
      $("currentTitle").textContent = "Pilih Saluran";
      $("currentMeta").textContent = "Daftar saluran IPTV Indonesia & Global";
      $("currentLogo").innerHTML = `<i data-lucide="tv" class="w-5 h-5 text-gray-400"></i>`;
      lucide.createIcons();
      if (Hls.isSupported()) hls.destroy();
      video.src = "";

      fetch(SOURCES[cat])
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(text => {
          state.all = parseM3U(text);
          applyFilter();
          renderList();
          if (state.filtered.length > 0) play(0);
        })
        .catch(e => { $("channelList").innerHTML = `<div class="p-4 text-center text-xs text-rose-400">Gagal memuat: ${e.message}</div>`; });
    }

    function play(idx) {
      if (idx < 0 || idx >= state.filtered.length) return;
      const ch = state.filtered[idx];
      state.activeIdx = idx;

      $("currentTitle").textContent = ch.name;
      $("currentMeta").textContent = `${ch.group || 'Umum'} • ${new URL(ch.url).hostname}`;
      $("currentLogo").innerHTML = ch.logo
        ? `<img src="${ch.logo}" class="w-full h-full object-contain rounded-lg" onerror="this.parentElement.innerHTML='<i data-lucide=\\'tv\\' class=\\'w-5 h-5 text-gray-400\\'></i>'; lucide.createIcons();" />`
        : `<i data-lucide="tv" class="w-5 h-5 text-gray-400"></i>`;
      lucide.createIcons();

      $("playerError").classList.add("hidden");
      $("playerLoading").classList.remove("hidden");

      // All streams route through /api/proxy so chunk/ts sub-URLs are CORS-safe
      const targetUrl = `/api/proxy?url=${encodeURIComponent(ch.url)}`;

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(targetUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          $("playerLoading").classList.add("hidden");
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            $("playerLoading").classList.add("hidden");
            $("playerError").classList.remove("hidden");
            $("playerErrorText").textContent = `Stream gagal dimuat. Coba saluran lain.`;
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari / iOS native HLS
        video.src = targetUrl;
        video.addEventListener("loadedmetadata", () => {
          $("playerLoading").classList.add("hidden");
          video.play().catch(() => {});
        });
        video.addEventListener("error", () => {
          $("playerLoading").classList.add("hidden");
          $("playerError").classList.remove("hidden");
          $("playerErrorText").textContent = `Browser tidak mendukung format ini.`;
        });
      }

      renderList();
    }

    // Expose globally
    window.play = play;

    // HLS instance ref
    let hls = null;
    const video = $("videoPlayer");

    // Category tabs
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => {
          b.classList.remove("active", "bg-indigo-600", "text-white");
          b.classList.add("text-gray-400");
        });
        btn.classList.add("active", "bg-indigo-600", "text-white");
        btn.classList.remove("text-gray-400");
        loadPlaylist(btn.dataset.cat);
      });
    });

    // Search
    $("searchInput").addEventListener("input", () => {
      applyFilter();
      state.activeIdx = -1;
      renderList();
    });

    // Retry
    $("retryBtn").addEventListener("click", () => {
      if (state.activeIdx >= 0) play(state.activeIdx);
    });

    // Next channel
    $("nextBtn").addEventListener("click", () => {
      const next = state.activeIdx + 1;
      play(next < state.filtered.length ? next : 0);
    });

    // Share
    $("shareBtn").addEventListener("click", () => {
      if (navigator.share) {
        navigator.share({ title: "Noir TV", url: location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(location.href);
        const el = $("shareBtn");
        el.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>`;
        lucide.createIcons();
        setTimeout(() => {
          el.innerHTML = `<i data-lucide="share-2" class="w-3.5 h-3.5"></i>`;
          lucide.createIcons();
        }, 1500);
      }
    });

    // Init
    loadPlaylist("id");
  </script>
</body>
</html>
